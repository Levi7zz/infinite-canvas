# Add this location inside the public canvas.scai.my HTTPS server block.
# It keeps New API account setup same-origin with canvas.scai.my while the
# upstream New API container remains unchanged.
location ^~ /new-api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cookie_path /api/user/auth /new-api/api/user/auth;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
}
